version: '3.8'

services:
  app:
    build: .
    container_name: dapursaji-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    depends_on:
      - socket
    networks:
      - dapursaji-net

  socket:
    build: .
    container_name: dapursaji-socket
    restart: always
    command: node server/socket-server.js
    ports:
      - "3001:3001"
    env_file:
      - .env.production
    networks:
      - dapursaji-net

  # Reverse proxy (opsional - bisa pakai Caddy/nginx untuk SSL)
  caddy:
    image: caddy:alpine
    container_name: dapursaji-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - dapursaji-net

volumes:
  caddy_data:
  caddy_config:

networks:
  dapursaji-net:
    driver: bridge
